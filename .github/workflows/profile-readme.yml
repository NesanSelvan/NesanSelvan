name: Update profile README

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@nesan4selvan"
          max_post_count: 5
          template: "$newline- [$title]($url)"

      - name: Pull latest releases
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "RELEASES"
          feed_list: "https://github.com/NesanSelvan/devcli/releases.atom,https://github.com/NesanSelvan/Agents-Space/releases.atom"
          max_post_count: 5
          template: "$newline- [$title]($url) — $date"
          date_format: "mmm d, yyyy"
