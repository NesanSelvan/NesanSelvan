name: Regenerate contribution scan

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render contribution scan SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/contrib_scan.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain assets/contrib-scan.svg)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/contrib-scan.svg
            git commit -m "chore: refresh contribution scan"
            git push
          else
            echo "no change"
          fi
