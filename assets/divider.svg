<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 18" width="880" height="18" role="presentation">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#2DD4BF" stop-opacity="0.75"/>
      <stop offset="55%"  stop-color="#2DD4BF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="8.5" width="880" height="1" fill="#30363D" opacity="0.5"/>

  <g filter="url(#soft)">
    <rect y="8.25" width="190" height="1.5" fill="url(#sweep)">
      <animate attributeName="x" dur="7s" repeatCount="indefinite"
               values="-190;-190;880;880" keyTimes="0;0.12;0.62;1"/>
    </rect>
  </g>
</svg>
