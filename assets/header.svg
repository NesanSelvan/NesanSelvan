<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Nesan Selvan — software engineer. Flutter, Python, Rust, Postgres, LLMs.">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#2DD4BF" stop-opacity="0.9"/>
      <stop offset="82%"  stop-color="#2DD4BF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-50%" width="700%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel"><rect x="1" y="1" width="878" height="258" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="877" height="257" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>

  <g clip-path="url(#panel)" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">

    <text x="48" y="86" font-size="40" font-weight="600" fill="#E6EDF3" letter-spacing="-0.5" opacity="0">
      nesan selvan
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.02;0.09;0.93;1"/>
    </text>

    <text x="50" y="116" font-size="14.5" fill="#7D8590" letter-spacing="0.6" opacity="0">
      software engineer · mumbai · builds ai products end to end
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.06;0.13;0.93;1"/>
    </text>

    <rect x="50" y="132" height="1.5" width="0" fill="url(#rule)">
      <animate attributeName="width" dur="9s" repeatCount="indefinite"
               values="0;0;300;300;0" keyTimes="0;0.08;0.2;0.93;1"/>
    </rect>

    <g opacity="0.9">
      <g transform="translate(50,168)">
        <rect width="92" height="34" rx="8" fill="#161B22" stroke="#2DD4BF" stroke-opacity="0.35" opacity="0">
          <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.170;0.195;0.92;1"/>
        </rect>
        <text x="46" y="22" font-size="13.5" fill="#C9D1D9" text-anchor="middle" opacity="0">flutter
          <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.170;0.195;0.92;1"/>
        </text>
      </g>
      <g transform="translate(154,168)">
        <rect width="92" height="34" rx="8" fill="#161B22" stroke="#2DD4BF" stroke-opacity="0.35" opacity="0">
          <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.222;0.247;0.92;1"/>
        </rect>
        <text x="46" y="22" font-size="13.5" fill="#C9D1D9" text-anchor="middle" opacity="0">python
          <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.222;0.247;0.92;1"/>
        </text>
      </g>
      <g transform="translate(258,168)">
        <rect width="74" height="34" rx="8" fill="#161B22" stroke="#2DD4BF" stroke-opacity="0.35" opacity="0">
          <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.274;0.299;0.92;1"/>
        </rect>
        <text x="37" y="22" font-size="13.5" fill="#C9D1D9" text-anchor="middle" opacity="0">rust
          <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.274;0.299;0.92;1"/>
        </text>
      </g>
      <g transform="translate(344,168)">
        <rect width="104" height="34" rx="8" fill="#161B22" stroke="#2DD4BF" stroke-opacity="0.35" opacity="0">
          <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.317;0.342;0.92;1"/>
        </rect>
        <text x="52" y="22" font-size="13.5" fill="#C9D1D9" text-anchor="middle" opacity="0">postgres
          <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.317;0.342;0.92;1"/>
        </text>
      </g>
      <g transform="translate(460,168)">
        <rect width="118" height="34" rx="8" fill="#161B22" stroke="#2DD4BF" stroke-opacity="0.35" opacity="0">
          <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.375;0.400;0.92;1"/>
        </rect>
        <text x="59" y="22" font-size="13.5" fill="#C9D1D9" text-anchor="middle" opacity="0">vision + llm
          <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.375;0.400;0.92;1"/>
        </text>
      </g>
    </g>

    <text x="50" y="234" font-size="13" fill="#484F58" letter-spacing="0.4" opacity="0">
      scanning…  resolved 5 items
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
               values="0;0;0.9;0.9;0" keyTimes="0;0.44;0.5;0.92;1"/>
    </text>

    <g filter="url(#glow)">
      <rect y="20" width="2" height="220" fill="url(#beam)" opacity="0">
        <animate attributeName="x" dur="9s" repeatCount="indefinite"
                 values="40;40;840;840;40" keyTimes="0;0.14;0.44;0.92;1"/>
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
                 values="0;0;1;1;0;0" keyTimes="0;0.13;0.16;0.42;0.45;1"/>
      </rect>
    </g>
  </g>
</svg>
